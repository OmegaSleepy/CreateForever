
plugins {
    id("java-library")
    id("maven-publish")
    id("idea")
    id("net.neoforged.moddev") version "2.0.140"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenLocal()

    // Create, Ponder, Flywheel
    maven {
        url = "https://maven.createmod.net"
    }

    // Registrate
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
    }

    // JEI
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }

    // Modrinth and mod dependency repositories
    exclusiveContent {
        forRepositories(
                maven {
                    name = "Progwml6's maven"
                    url = "https://dvs1.progwml6.com/files/maven/"
                },
                maven {
                    name = "ModMaven"
                    url = "https://modmaven.dev"
                },
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
        )

        filter {
            includeGroup("maven.modrinth")
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty("neoforge.enabledGameTestNamespaces", project.mod_id)
        }

        server {
            server()
            programArgument("--nogui")
            systemProperty("neoforge.enabledGameTestNamespaces", project.mod_id)
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty("neoforge.enabledGameTestNamespaces", project.mod_id)
        }

        data {
            data()

            programArguments.addAll(
                    "--mod", project.mod_id,
                    "--all",
                    "--output", file("src/generated/resources").absolutePath,
                    "--existing", file("src/main/resources").absolutePath
            )
        }

        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Generated resources
sourceSets.main.resources {
    srcDir("src/generated/resources")
}

// Dependencies
dependencies {
    // Create ecosystem
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // Modrinth dependencies
    implementation("maven.modrinth:L3Jv0QZI:czVeSmZo")
    runtimeOnly("maven.modrinth:u6dRKJwZ:Tbomhybz")

    // JEI
    compileOnly("mezz.jei:jei-1.21.1-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-1.21.1-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-1.21.1-neoforge:${jei_version}")
}

// Mod metadata generation
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors              : mod_authors,
            mod_description         : mod_description
    ]

    inputs.properties(replaceProperties)

    expand(replaceProperties)

    from("src/main/templates")
    into("build/generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

// Publishing
publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from(components.java)
        }
    }

    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

// IntelliJ IDEA
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
