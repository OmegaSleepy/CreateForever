
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

issueTrackerURL = "https://github.com/OmegaSleepy/CreateForever/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/cfcm"
logoFile = "assets/createforever/icon.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# NeoForge
[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

# Minecraft
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "AFTER"
side = "BOTH"

# Create
[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "AFTER"
side = "BOTH"

# Create: Steam 'n' Rails
[[dependencies."${mod_id}"]]
modId = "railways"
type = "optional"
versionRange = "[0.3.0-beta.2,)"
ordering = "AFTER"
side = "BOTH"

# Let's Do: Vinery
[[dependencies."${mod_id}"]]
modId = "vinery"
type = "optional"
versionRange = "[1.5.6,)"
ordering = "AFTER"
side = "SERVER"

# Just Enough Items
[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
versionRange = "[19.0,)"
ordering = "AFTER"
side = "BOTH"
